<svg viewBox="-16.0 -16.0 652.0 242.0" width="652.0" height="242.0" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Above: a chain of poll cycles that ends permanently at the first failed one. Below: the same chain where the failed cycle sends a re-auth message and the loop continues, recovering on a later cycle"><rect x="-16.0" y="-16.0" width="652.0" height="242.0" fill="#0E0A14"/>
        <g font-family="ui-monospace,monospace" font-size="9" fill="#EDE6DA">
          <text x="0" y="12" opacity=".6">BEFORE — A FAILED STEP ENDS THE RUN</text>
        </g>
        <g stroke="#EDE6DA" stroke-width="1" fill="#171122">
          <rect x="0" y="24" width="74" height="24"/><rect x="88" y="24" width="74" height="24"/>
          <rect x="176" y="24" width="74" height="24"/>
        </g>
        <rect x="264" y="24" width="74" height="24" fill="none"
          stroke="#FF6B5E" stroke-width="2"/>
        <g font-family="ui-monospace,monospace" font-size="8" fill="#EDE6DA">
          <text x="8" y="40">poll</text><text x="96" y="40">poll</text><text x="184" y="40">poll</text>
          <text x="272" y="40" fill="#FF6B5E">invalid_grant</text>
        </g>
        <g stroke="#EDE6DA" stroke-width="1" opacity=".5">
          <path d="M74 36 L88 36"/><path d="M162 36 L176 36"/><path d="M250 36 L264 36"/>
        </g>
        <g stroke="#FF6B5E" stroke-width="2" opacity=".9">
          <path d="M352 28 L372 44"/><path d="M372 28 L352 44"/>
        </g>
        <text x="386" y="40" font-family="ui-monospace,monospace" font-size="9"
          fill="#FF6B5E">execution over — and no alert</text>
        <text x="0" y="66" font-family="ui-monospace,monospace" font-size="8"
          fill="#EDE6DA" opacity=".55">indistinguishable from an empty inbox</text>

        <g font-family="ui-monospace,monospace" font-size="9" fill="#EDE6DA">
          <text x="0" y="112" opacity=".6">AFTER — A FAILED CYCLE IS JUST A CYCLE</text>
        </g>
        <g stroke="#EDE6DA" stroke-width="1" fill="#171122">
          <rect x="0" y="124" width="74" height="24"/><rect x="88" y="124" width="74" height="24"/>
          <rect x="176" y="124" width="74" height="24"/><rect x="352" y="124" width="74" height="24"/>
          <rect x="440" y="124" width="74" height="24"/>
        </g>
        <rect x="264" y="124" width="74" height="24" fill="none"
          stroke="#B57BFF" stroke-width="2"/>
        <g font-family="ui-monospace,monospace" font-size="8" fill="#EDE6DA">
          <text x="8" y="140">poll</text><text x="96" y="140">poll</text><text x="184" y="140">poll</text>
          <text x="272" y="140" fill="#B57BFF">caught</text>
          <text x="360" y="140">poll</text><text x="448" y="140">poll</text>
        </g>
        <g stroke="#EDE6DA" stroke-width="1" opacity=".5">
          <path d="M74 136 L88 136"/><path d="M162 136 L176 136"/><path d="M250 136 L264 136"/>
          <path d="M338 136 L352 136"/><path d="M426 136 L440 136"/>
        </g>
        <path d="M301 148 L301 172" stroke="#B57BFF" stroke-width="1.5" fill="none"/>
        <text x="252" y="186" font-family="ui-monospace,monospace" font-size="9"
          fill="#B57BFF">"re-auth needed" — to you, not to a log</text>
        <text x="528" y="140" font-family="ui-monospace,monospace" font-size="8"
          fill="#EDE6DA" opacity=".55">recovers</text>
      </svg>