<svg viewBox="-16.0 -16.0 652.0 412.0" width="652.0" height="412.0" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A 120-second poll loop queries the Gmail API for unread Primary mail, filters it, checks SQLite for ids already seen, and sends only new ones as Telegram cards; card buttons act back on Gmail, the draft path goes through the model to a preview and only becomes a Gmail draft on accept, and an expired grant sends a re-auth notice without stopping the loop"><rect x="-16.0" y="-16.0" width="652.0" height="412.0" fill="#F4F0E8"/>
        <defs><symbol id="i-py" viewBox="0 0 24 24"><path fill="currentColor" d="M11.9 1.5c-2.6 0-4.4.8-4.4 3v2.3h4.5v.8H5.7c-2.2 0-4.1 1.3-4.1 4.5s1.7 4.6 3.9 4.6h1.6v-2.8c0-2.4 2.1-4.5 4.5-4.5h4.5c2 0 3.6-1.6 3.6-3.6V4.5c0-1.9-1.6-2.6-3.6-2.9-1.4-.1-2.8-.1-4.2-.1Zm-2.4 2c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9Z"/><path fill="currentColor" opacity=".55" d="M12.1 22.5c2.6 0 4.4-.8 4.4-3v-2.3H12v-.8h6.3c2.2 0 4.1-1.3 4.1-4.5s-1.7-4.6-3.9-4.6h-1.6v2.8c0 2.4-2.1 4.5-4.5 4.5H7.9c-2 0-3.6 1.6-3.6 3.6v1.3c0 1.9 1.6 2.6 3.6 2.9 1.4.1 2.8.1 4.2.1Zm2.4-2c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9Z"/></symbol>
          <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0 0 L7 3.5 L0 7 z" fill="#1A1420"/></marker>
          <marker id="agf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0 0 L7 3.5 L0 7 z" fill="#C2382C"/></marker>
        </defs>
        <g font-family="ui-monospace,monospace" font-size="9" fill="#1A1420">
          <text x="470" y="14" opacity=".85">GMAIL API</text>
          <line x1="470" y1="20" x2="560" y2="20" stroke="#1A1420" stroke-width="1"/>
          <text x="470" y="36" opacity=".5">category:primary</text>
          <text x="470" y="49" opacity=".5">is:unread</text>

          <use color="#1A1420" href="#i-py" x="0" y="82" width="12" height="12" opacity=".85"/>
          <text x="18" y="92" opacity=".85">ONE PROCESS · systemd</text>

          <rect x="0" y="104" width="150" height="38" fill="#EAE4D8" stroke="#6B3FBF" stroke-width="2"/>
          <text x="10" y="122" fill="#6B3FBF">poll loop</text>
          <text x="10" y="135" fill="#6B3FBF" opacity=".75">every 120 s</text>

          <rect x="0" y="174" width="150" height="38" fill="#EAE4D8" stroke="#1A1420" stroke-width="1"/>
          <text x="10" y="192">triage filter</text>
          <text x="10" y="205" opacity=".55">unread · Primary · cap 20</text>

          <rect x="0" y="244" width="150" height="38" fill="#EAE4D8" stroke="#1A1420" stroke-width="1"/>
          <text x="10" y="262">sqlite</text>
          <text x="10" y="275" opacity=".55">seen ids · drafts</text>

          <rect x="236" y="26" width="150" height="46" fill="none" stroke="#C2382C" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="246" y="48" fill="#C2382C">re-auth notice</text>
          <text x="246" y="61" fill="#C2382C" opacity=".7">the loop keeps running</text>

          <rect x="236" y="174" width="150" height="38" fill="#EAE4D8" stroke="#1A1420" stroke-width="1"/>
          <text x="246" y="192">telegram card</text>
          <text x="246" y="205" opacity=".55">read · trash · draft</text>

          <rect x="236" y="244" width="150" height="34" fill="#EAE4D8" stroke="#1A1420" stroke-width="1"/>
          <text x="246" y="265">draft preview</text>

          <rect x="236" y="310" width="150" height="34" fill="#EAE4D8" stroke="#6B3FBF" stroke-width="2"/>
          <text x="246" y="331" fill="#6B3FBF">accept — you</text>

          <rect x="470" y="244" width="150" height="34" fill="#EAE4D8" stroke="#1A1420" stroke-width="1"/>
          <text x="480" y="265">the model</text>
          <text x="470" y="294" opacity=".5">regenerate loops here</text>

          <text x="470" y="325" opacity=".85">GMAIL DRAFT</text>
          <line x1="470" y1="331" x2="580" y2="331" stroke="#1A1420" stroke-width="1"/>
          <text x="470" y="347" opacity=".5">on the thread, unsent</text>

          <text x="0" y="322" opacity=".6">THE ONLY WRITE TO GMAIL</text>
          <text x="0" y="340" opacity=".6">IS A DRAFT, AND ONLY</text>
          <text x="0" y="358" opacity=".6">AFTER YOU PRESS ACCEPT</text>
        </g>

